[project]
name = "generate-names"
version = "0.1.0"
description = "Generate first and last names from different regions using names_dataset"
authors = [{ name = "LionelRohner", email = "lionel.rohner@gmail.com" }]
license = "MIT"
requires-python = ">=3.14"
dependencies = ["pandas (>=3.0.3,<4.0.0)", "names-dataset (>=3.3.1,<4.0.0)", "requests (>=2.34.2,<3.0.0)"]

[tool.poetry]
package-mode = false

[dependency-groups]
dev = ["dotenv (>=0.9.9,<0.10.0)"]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
