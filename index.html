<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Re🦆tor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&family=Syne+Mono&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
    <link rel="stylesheet" href="css/variables.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/ui.css" />
  </head>
  <body>
    <!-- Mobile Block -->
    <div class="mobile-block">
      ⚠️ This page isn't supported on mobile yet. Please visit on a desktop
      browser.
    </div>

    <h1>Re🦆tor</h1>
    <h4>Mask-Sanitize-Veil</h4>
    <!-- SIDE PANEL TOGGLE -->
    <div class="toggle-container left">
      <button id="sidebar-btn" class="toggle-btn" onclick="togglePanel()">
        <i class="fas fa-bars"></i>
      </button>
    </div>

    <!-- DARK MODE TOGGLE BUTTON CONTAINER -->
    <div class="toggle-container right">
      <button id="darkmode-btn" class="toggle-btn" onclick="toggleDarkMode()">
        <i class="fa-solid fa-moon"></i>
      </button>
    </div>

    <!-- MAIN CONTENT CONTAINER -->
    <div class="clipboard-wrapper">
      <div class="tab-switcher">
        <button
          class="tabBtn active"
          id="tabIn"
          onclick="switchToIn()"
          data-tooltip="View the original text"
        >
          Original
        </button>
        <button
          class="tabBtn"
          id="tabOut"
          onclick="switchToOut()"
          data-tooltip="View the redacted version"
        >
          Redacted
        </button>
        <button
          class="tabBtn"
          id="flushBtn"
          onclick="flushButtonAction()"
          data-tooltip="Flush Output"
        >
          <i class="fas fa-trash-can"></i>
        </button>
      </div>

      <div class="clipboard-panel">
        <div
          id="clipboardIn"
          contenteditable="true"
          placeholder="Dump your text here..."
        ></div>
        <div id="clipboardOut" contenteditable="false"></div>
        <button class="tabBtn" id="copyBtn" onclick="copyClipboardContent()">
          <i class="fa-solid fa-copy"></i>
        </button>
      </div>
    </div>

    <!-- BUTTON CONTAINER PRESET -->
    <div class="button-container-exp">
      <span class="experimental-label">THEMATIC REDACTORS (EXPERIMENTAL)</span>
      <button class="redact-btn" onclick="redactOrgs()">Orgs</button>
      <button class="redact-btn" onclick="redactNames()">Names</button>
      <button class="redact-btn" onclick="redactDates()">Dates</button>
      <button class="redact-btn" onclick="redactPhones()">Phones</button>
      <button class="redact-btn" onclick="redactEmails()">Emails</button>
      <button class="redact-btn" onclick="redactPlaces()">Places</button>
    </div>

    <!-- REDACTION PATTERNS TEXT AREA -->
    <div
      id="redactPatterns"
      contenteditable="true"
      placeholder="Enter patterns to redact (one per line)."
    ></div>

    <!-- BUTTON CONTAINER CUSTOM -->
    <div class="button-container">
      <button class="redact-btn" onclick="redactText()">
        Redact Custom Text
      </button>
    </div>

    <!-- SIDE PANEL -->
    <aside class="side-panel">
      <button class="close-btn" onclick="togglePanel()">×</button>
      <div class="panel-content">
        <h2>Redaction Parameters</h2>
        <h3>Redaction Placeholder</h3>

        <div class="placeholder-toggle" onchange="toggleRedactionPlaceholder()">
          <input
            type="radio"
            name="placeholderMode"
            id="block"
            value="false"
            checked
          />
          <label for="block" data-tooltip="Use block-style placeholders: █████"
            >Block</label
          >

          <input
            type="radio"
            name="placeholderMode"
            id="labelled"
            value="true"
          />
          <label
            for="labelled"
            data-tooltip="Use labelled placeholders: [REDACTED-DATE]"
            >Labelled</label
          >
        </div>

        <h3>Name Regions</h3>
        <div class="region-toggle" onchange="toggleNameRegion()">
          <input
            type="radio"
            name="regionMode"
            id="western"
            value="western"
            checked
          />
          <label for="western" data-tooltip="Western Countries">Western</label>

          <input
            type="radio"
            name="regionMode"
            id="european"
            value="european"
          />
          <label for="european" data-tooltip="European Countries">Europe</label>

          <input type="radio" name="regionMode" id="asian" value="asian" />
          <label for="asian" data-tooltip="Asian Countries">Asia</label>

          <input
            type="radio"
            name="regionMode"
            id="top_20_countries"
            value="top_20_countries"
          />
          <label
            for="top_20_countries"
            data-tooltip="Top 20 most populated countries"
            >International</label
          >
        </div>
      </div>
    </aside>

    <div class="footer">
      <span class="footer-light">Powered by Robo [【•】◡【•】]</span>
      <span class="footer-dark">Powered by Robo [【-】◡【-】] zZz</span>
    </div>
    <!-- Import NLP module and JS -->
    <script src="https://unpkg.com/compromise"></script>
    <script src="https://unpkg.com/compromise-dates"></script>
    <script src="js/main.js"></script>
    <script src="js/button.js"></script>
  </body>
</html>
